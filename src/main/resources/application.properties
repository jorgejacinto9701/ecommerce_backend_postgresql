# ===== PostgreSQL (datos transaccionales) =====
# Las credenciales se toman de variables de entorno; los valores por defecto son solo para desarrollo local.
# Supabase: usar el Session pooler (compatible con IPv4), por ejemplo:
#   DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USER=postgres.<ref-del-proyecto>
# Copia la cadena exacta desde Supabase > Connect.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sql_ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.jpa.show-sql = ${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.open-in-view = true
spring.jpa.hibernate.ddl-auto= none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== Cloudflare R2 (imagenes de productos) =====
# R2_ENDPOINT   : https://<ACCOUNT_ID>.r2.cloudflarestorage.com
# R2_PUBLIC_URL : URL publica del bucket (dominio propio o r2.dev), sin "/" final. El frontend la usa para mostrar las imagenes.
# Si no se definen, la app arranca igual pero subir imagenes devuelve un error claro.
r2.endpoint=${R2_ENDPOINT:}
r2.bucket=${R2_BUCKET:}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.public-url=${R2_PUBLIC_URL:}

# ===== Carga de archivos (imagenes) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Seguridad =====
# JWT_SECRET: clave en Base64 de al menos 64 bytes (ej: openssl rand -base64 64 | tr -d "\n").
# El valor por defecto es SOLO de desarrollo: cualquiera que tenga este archivo podria falsificar tokens.
app.jwt.secret=${JWT_SECRET:iuZG60TkLJRWvuCO3EsJ4u2TVwLs5VbUo0O3eVvn98e1zbBiVz0NgfJvZsFjcUDk6ESTLbscbWHn2ydUOTHDxA==}
app.jwt.expiration=36000
# Origenes permitidos para CORS (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Reglas de la tienda =====
# Envio gratis desde este monto (S/, con IGV). 0 = no hay envio gratis.
tienda.envio-gratis-desde=${ENVIO_GRATIS_DESDE:0}

logging.level.org.hibernate.orm.jdbc.bind=${LOG_BIND:info}

server.port = 8091
